name: Compose CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the default stack
        run: |
          test ! -e .env
          docker compose up --build --wait
      - name: Check ThinkHomeOS and PostgreSQL 16
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:13000/main/api/healthz |
            jq -e '.ok == true'
          docker compose exec -T db sh -ec '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW server_version_num"
          ' | awk 'NR == 1 { ok = ($1 >= 160000 && $1 < 170000) } END { exit !(NR == 1 && ok) }'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

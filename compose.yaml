services:
  app:
    build: .
    init: true
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s "$$APP_CONFIG_FILE" ]; then
          umask 077
          node dist/cli/index.js config init --dialect postgres --config "$$APP_CONFIG_FILE"
        fi
        exec node dist/server/standalone.js
    environment:
      APP_CONFIG_FILE: /app/storage/config.yml
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${APP_PORT:-13000}
      APP_SAMPLE_DATA: 'false'
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: ${POSTGRES_DB:-thinkhomeos}
      DB_USERNAME: ${POSTGRES_USER:-thinkhomeos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-thinkhomeos-local}
    ports:
      - '127.0.0.1:${APP_PORT:-13000}:13000'
    volumes:
      - app-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkhomeos}
      POSTGRES_USER: ${POSTGRES_USER:-thinkhomeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkhomeos-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  app-storage:
  postgres-data:
